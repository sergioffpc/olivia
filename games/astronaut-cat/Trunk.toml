trunk-version = "^0.22"

[tools]
wasm_opt = "version_133"

# The manifest of the source, which the game fetches on the web.
[[hooks]]
stage = "post_build"
command = "sh"
command_arguments = [
    "-c",
    'cargo run --manifest-path ../../crates/olivia-filesystem/Cargo.toml --bin olivia-manifest -- "$TRUNK_STAGING_DIR"',
]
