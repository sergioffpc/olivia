[project]
name = "mocap"
version = "0.1.0"
description = "Turns a side-on phone video into an Olivia animation file"
requires-python = ">=3.12,<3.13"
dependencies = ["mediapipe>=0.10.21,<0.11", "numpy", "opencv-contrib-python", "scipy"]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
