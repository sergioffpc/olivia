[graph]
all-features = true

[advisories]
ignore = [
    # Unmaintained, with no known flaw. winit's Wayland title bar reaches it through ab_glyph, and
    # cosmic-text through fontdb, where it reads the fonts a game loads.
    { id = "RUSTSEC-2026-0192", reason = "no alternative in winit or cosmic-text; no known flaw" },
]

[licenses]
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
exceptions = [
    # What olivia-filesystem watches the source with.
    { crate = "notify", allow = ["CC0-1.0"] },
    # A dependency of directories, which olivia-filesystem is built on.
    { crate = "option-ext", allow = ["MPL-2.0"] },
    # The decoders and audio thread of kira, which olivia-audio is built on.
    { crate = "audio_thread_priority", allow = ["MPL-2.0"] },
    { crate = "symphonia", allow = ["MPL-2.0"] },
    { crate = "symphonia-bundle-flac", allow = ["MPL-2.0"] },
    { crate = "symphonia-bundle-mp3", allow = ["MPL-2.0"] },
    { crate = "symphonia-codec-pcm", allow = ["MPL-2.0"] },
    { crate = "symphonia-codec-vorbis", allow = ["MPL-2.0"] },
    { crate = "symphonia-common", allow = ["MPL-2.0"] },
    { crate = "symphonia-core", allow = ["MPL-2.0"] },
    { crate = "symphonia-format-ogg", allow = ["MPL-2.0"] },
    { crate = "symphonia-format-riff", allow = ["MPL-2.0"] },
    { crate = "symphonia-metadata", allow = ["MPL-2.0"] },
    { crate = "triple_buffer", allow = ["MPL-2.0"] },
]

[bans]
# winit's platform crates pull in duplicates that cannot be resolved here.
multiple-versions = "allow"
deny = [
    # Two glam versions would break the rapier2d type sharing of ADR 0001.
    { crate = "glam", deny-multiple-versions = true },
]

[sources]
unknown-git = "deny"
unknown-registry = "deny"
