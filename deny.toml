[graph]
all-features = true

[licenses]
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
]
# A dependency of directories, which olivia-filesystem is built on.
exceptions = [{ crate = "option-ext", allow = ["MPL-2.0"] }]

[bans]
# winit's platform crates pull in duplicates that cannot be resolved here.
multiple-versions = "allow"
deny = [
    # Two glam versions would break the rapier2d type sharing of ADR 0001.
    { crate = "glam", deny-multiple-versions = true },
]

[sources]
unknown-git = "deny"
unknown-registry = "deny"
