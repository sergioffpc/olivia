[graph]
all-features = true

[advisories]
ignore = [
    # Unmaintained, with no known flaw. winit's Wayland title bar reaches it through ab_glyph, and
    # cosmic-text through fontdb, where it reads the fonts a game loads.
    { id = "RUSTSEC-2026-0192", reason = "no alternative in winit or cosmic-text; no known flaw" },
]

[licenses]
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
# A dependency of directories, which olivia-filesystem is built on.
exceptions = [{ crate = "option-ext", allow = ["MPL-2.0"] }]

[bans]
# winit's platform crates pull in duplicates that cannot be resolved here.
multiple-versions = "allow"
deny = [
    # Two glam versions would break the rapier2d type sharing of ADR 0001.
    { crate = "glam", deny-multiple-versions = true },
]

[sources]
unknown-git = "deny"
unknown-registry = "deny"
