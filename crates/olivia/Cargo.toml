[package]
name = "olivia"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["filesystem", "graphics"]
filesystem = ["dep:olivia-filesystem"]
graphics = ["dep:olivia-graphics"]

[dependencies]
olivia-filesystem = { workspace = true, optional = true }
olivia-graphics = { workspace = true, optional = true }
olivia-math.workspace = true
olivia-window.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
tracing-subscriber.workspace = true

[[example]]
name = "clear"
required-features = ["graphics"]

[[example]]
name = "filesystem"
required-features = ["filesystem"]

[[example]]
name = "draw_options"
required-features = ["graphics"]

[[example]]
name = "sprite"
required-features = ["filesystem", "graphics"]

[[example]]
name = "text"
required-features = ["filesystem", "graphics"]

[lints]
workspace = true
