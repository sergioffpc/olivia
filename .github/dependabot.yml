version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    ignore:
      # Must stay at the version rapier2d uses (ADR 0001).
      - dependency-name: glam
  - package-ecosystem: rust-toolchain
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: build
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
